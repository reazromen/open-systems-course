name: Verify Open Systems Course
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify all lessons and assets exist
        run: |
          test -s course.html
          test "$(find source/perspectives -maxdepth 1 -type f -name 'open-systems-*.md' | wc -l)" -eq 180
          test "$(find posts -maxdepth 1 -type f -name 'open-systems-*.html' | wc -l)" -eq 180
          test -s assets/open-systems-course.css
          test -s assets/site.css
          test -d static
          grep -q 'https://learn.reazromen.com/course.html' course.html
          grep -q 'X-Robots-Tag' README.md
