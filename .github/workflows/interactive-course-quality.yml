name: Interactive course quality

on:
  pull_request:
    paths:
      - 'assets/interactive-*.js'
      - 'assets/interactive-*.css'
      - 'source/perspectives/open-systems-*.md'
      - 'posts/open-systems-*.html'
      - 'tests/**'
      - 'tools/**'
      - 'requirements-renderer.txt'
      - '.github/workflows/interactive-course-quality.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: read

concurrency:
  group: interactive-course-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned renderer dependencies
        run: python -m pip install -r requirements-renderer.txt
      - name: Run deterministic JavaScript tests
        run: node --test tests/interactive-course.test.cjs tests/interactive-simulations.test.cjs
      - name: Run renderer and integrity tests
        run: python -m unittest tests/test_render_course.py -v
      - name: Verify all canonical lesson source/output pairs
        run: python tools/render_course.py --check
      - name: Check JavaScript syntax and patch whitespace
        run: |
          node --check assets/interactive-course.js
          node --check assets/interactive-simulations.js
          node --check assets/interactive-prototypes.js
          node --check tests/interactive-course-browser-smoke.cjs
          git diff --check
